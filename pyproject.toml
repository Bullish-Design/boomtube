[project]
name = "boomtube"
version = "0.1.0"
description = "Project-local symlink manager with safe migration"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Boomtube contributors"}]
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.10",
  # The CLI uses a root callback + named subcommands (typer >=0.12, current 0.27.x).
  # This structure is version-independent across the supported range; verify with:
  #   uv run --with "typer==0.12" -- python -m boomtube apply --help
  "typer>=0.12",
  "PyYAML>=6.0",
]


[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.1",
  #"mypy>=1.10",
  "ruff>=0.5.0",
]

[project.scripts]
boomtube = "boomtube.cli:app"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boomtube"]

[tool.pytest.ini_options]
addopts = "-q --cov=boomtube --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
