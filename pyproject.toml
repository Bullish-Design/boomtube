[project]
name = "boomtube"
version = "0.3.0"
description = "Project-local symlink manager with safe migration"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Boomtube contributors"}]
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.10",
  # The CLI uses a root callback + named subcommands (typer >=0.15.4, current
  # 0.27.x). Validated against a version matrix:
  #   typer 0.12      : broken — union-typed params (`Path | None`) unsupported
  #   typer 0.13–0.15.3: broken — incompatible with current click (make_metavar)
  #   typer >=0.15.4  : works (apply/config --help, bare help, real apply)
  # Verify with:  uv run --with "typer==0.15.4" -- python -m boomtube apply --help
  "typer>=0.15.4",
  "PyYAML>=6.0",
]


[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.1",
  #"mypy>=1.10",
  "ruff>=0.5.0",
]

[project.scripts]
boomtube = "boomtube.cli:app"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boomtube"]

[tool.pytest.ini_options]
addopts = "-q --cov=boomtube --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
