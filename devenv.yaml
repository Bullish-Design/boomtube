# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
  nix2container:
    url: github:nlewo/nix2container
  mk-shell-bin:
    url: github:rrbutani/nix-mk-shell-bin
  # shellij: durable Zellij workbenches. This repo does not import RepoMan's
  # meta-module, so it imports shellij's devenv module directly — shellij/zellij/
  # yazi packages, the guarded `shellij open` enterShell hook, and
  # YAZI_CONFIG_HOME pointing at the packaged Yazi assets.
  shellij:
    url: path:/home/andrew/Documents/Projects/shellij

imports:
  - shellij/modules


# If you're using non-OSS software, you can set allowUnfree to true.
# allowUnfree: true

# If you're willing to use a package that's vulnerable
# permittedInsecurePackages:
#  - "openssl-1.1.1w"

